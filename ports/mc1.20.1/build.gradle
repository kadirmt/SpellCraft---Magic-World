plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.7.435" apply false
    id "com.gradleup.shadow" version "8.3.5" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    repositories {
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.minecraftforge.net/" } // Forge + TerraBlender
        maven {
            url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            content {
                includeGroupByRegex("software\\.bernie.*")
                // GeckoLib 4.8.x (1.20.1) transitif bagimliligi mclib de bu repoda
                includeGroupByRegex("com\\.eliotlash.*")
            }
        }
        maven { url "https://maven.ladysnake.org/releases" }
        maven { url "https://maven.shedaniel.me" } // REI/Cloth Config (yalnizca gelistirme istemcisi)
        mavenCentral()
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }
}
