plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    // GeckoLib — animasyonlu modeller/itemlar (runtime + render)
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${rootProject.geckolib_version}"

    // TerraBlender — yerel jar (glitchfiend maven bu ortamdan erişilemez); biyom enjeksiyonu
    modImplementation files("${rootProject.projectDir}/libs/TerraBlender-fabric-${rootProject.terrablender_version}.jar")
    // TerraBlender'ın night-config bağımlılığı — kullanıcıda JiJ'li gelir, dev'de manuel gerekir
    runtimeOnly "com.electronwill.night-config:core:3.6.7"
    runtimeOnly "com.electronwill.night-config:toml:3.6.7"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    // REI (Roughly Enough Items) — SADECE geliştirme istemcisinde (runClient/runServer),
    // asıl mod jar'ına dahil edilmiyor/gerektirilmiyor (modLocalRuntime). Tarif/eşya
    // gözden geçirme kolaylığı için, kullanıcı isterse asıl oyununda ayrıca kurar.
    // NOT: resmi maven.shedaniel.me kullanılıyor (Modrinth'in maven proxy'si POM
    // içermiyor, REI'nin kendi "math" alt bağımlılığını çekemeyip NoClassDefFoundError
    // ile çöküyordu).
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:16.0.788"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}
